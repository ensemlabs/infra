[Interface]
Address = 10.66.0.2/24
MTU = 1380
# Do not let wg-quick replace the default route. Only marked replies use table 51820.
Table = off
PostUp = wg set %i private-key /etc/wireguard/home.key
# Mark flows that arrived on wg0; replies inherit fwmark 0x66 (inline nft: AppArmor blocks nft -f).
PostUp = nft add table ip wghome; nft 'add chain ip wghome prerouting { type filter hook prerouting priority -150; policy accept; }'; nft add rule ip wghome prerouting iifname "wg0" ct mark set 0x66; nft 'add chain ip wghome output { type route hook output priority -150; policy accept; }'; nft add rule ip wghome output ct mark 0x66 meta mark set 0x66
PostUp = ip rule add fwmark 0x66 lookup 51820 priority 100
PostUp = ip route replace default dev wg0 table 51820
PostDown = ip rule del fwmark 0x66 lookup 51820 priority 100 || true
PostDown = nft delete table ip wghome || true

[Peer]
# VPS
PublicKey = __VPS_PUB__
Endpoint = __PUBLIC_HOST__:51820
AllowedIPs = 0.0.0.0/0
PersistentKeepalive = 25
