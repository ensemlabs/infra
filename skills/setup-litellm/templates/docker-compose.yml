name: litellm

x-restart: &restart
  restart: unless-stopped

services:
  litellm-postgres:
    <<: *restart
    image: postgres:17-alpine
    container_name: litellm-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: litellm
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [infra]

  litellm:
    <<: *restart
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      litellm-postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@litellm-postgres:5432/litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      STORE_MODEL_IN_DB: "True"
      UI_USERNAME: admin
      UI_PASSWORD: ${LITELLM_UI_PASSWORD}
      PROXY_BASE_URL: http://${PUBLIC_HOST}:${LITELLM_PUBLIC_PORT}
      LANGFUSE_HOST: http://langfuse-web:3000
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TELEGRAM_WEBHOOK_PRIVATE: "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage?chat_id=${TELEGRAM_CHAT_PRIVATE}"
      TELEGRAM_WEBHOOK_AUTOCAD: "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage?chat_id=${TELEGRAM_CHAT_AUTOCAD}"
      TELEGRAM_WEBHOOK_FENGSHUI: "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage?chat_id=${TELEGRAM_CHAT_FENGSHUI}"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    ports:
      - "${BIND_ADDR}:4000:4000"
      - "${WG_ADDR}:4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks: [infra]

networks:
  infra:
    external: true
    name: infra
