# Models are added in /ui and stored in Postgres (STORE_MODEL_IN_DB).
model_list: []

litellm_settings:
  drop_params: true
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]
  redact_messages_in_exceptions: true
  max_internal_user_budget: 20
  internal_user_budget_duration: "30d"

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  disable_spend_logs: false
  maximum_spend_logs_retention_period: "90d"
  store_prompts_in_spend_logs: false
  upperbound_key_generate_params:
    max_budget: 100
    budget_duration: "30d"
    rpm_limit: 300
    tpm_limit: 1000000
    max_parallel_requests: 20
  default_key_generate_params:
    max_budget: 10
    budget_duration: "30d"
  alerting: ["slack"]
  alerting_threshold: 300
  alert_types:
    - llm_exceptions
    - llm_too_slow
    - llm_requests_hanging
    - db_exceptions
    - outage_alerts
    - cooldown_deployment
  alerting_args:
    outage_alert_ttl: 60
    minor_outage_alert_threshold: 5
    major_outage_alert_threshold: 10
    max_outage_alert_list_size: 10
    log_to_console: false
  alert_type_config:
    llm_requests_hanging:
      digest: true
      digest_interval: 3600
    llm_too_slow:
      digest: true
      digest_interval: 3600
  alert_to_webhook_url:
    llm_exceptions: &telegram_webhooks
      - os.environ/TELEGRAM_WEBHOOK_PRIVATE
      - os.environ/TELEGRAM_WEBHOOK_AUTOCAD
      - os.environ/TELEGRAM_WEBHOOK_FENGSHUI
    llm_too_slow: *telegram_webhooks
    llm_requests_hanging: *telegram_webhooks
    db_exceptions: *telegram_webhooks
    outage_alerts: *telegram_webhooks
    cooldown_deployment: *telegram_webhooks
